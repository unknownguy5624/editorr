name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find project folder
        id: find
        run: |
          P=$(find . -name pubspec.yaml -not -path "./build_app/*" | head -n 1)
          echo "pubspec found at: '$P'"
          if [ -z "$P" ]; then
            echo "No pubspec.yaml in the repo. Files were not uploaded correctly."
            ls -R | head -50
            exit 1
          fi
          echo "src=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - name: Create Android scaffold and copy QuickCut code in
        run: |
          SRC="${{ steps.find.outputs.src }}"
          flutter create --platforms=android --project-name quickcut --org com.quickcut build_app
          rm -rf build_app/lib build_app/test
          cp -r "$SRC/lib" build_app/lib
          cp -r "$SRC/assets" build_app/assets
          cp "$SRC/pubspec.yaml" build_app/pubspec.yaml
          python3 "$SRC/tools/patch_android.py" build_app

      - name: Force compileSdk 36 for all plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compilesdk.gradle << 'EOF'
          gradle.beforeProject { p ->
            p.afterEvaluate {
              def ext = p.extensions.findByName('android')
              if (ext != null) {
                try {
                  def cur = ext.compileSdk
                  if (cur == null || cur < 36) {
                    ext.compileSdk = 36
                  }
                } catch (Throwable t) {
                  println "compileSdk override skipped for " + p.name
                }
              }
            }
          }
          EOF

      - name: Turn off R8 minify (it breaks WorkManager at app start)
        run: |
          F_KTS=build_app/android/app/build.gradle.kts
          F_GRV=build_app/android/app/build.gradle
          if [ -f "$F_KTS" ]; then
            sed -i 's|signingConfig = signingConfigs.getByName("debug")|&\n            isMinifyEnabled = false\n            isShrinkResources = false|' "$F_KTS"
            grep -n -B2 -A4 "isMinifyEnabled" "$F_KTS" || { echo "PATCH FAILED: release block not found"; cat "$F_KTS"; exit 1; }
          elif [ -f "$F_GRV" ]; then
            sed -i 's|signingConfig signingConfigs.debug|&\n            minifyEnabled false\n            shrinkResources false|' "$F_GRV"
            grep -n -B2 -A4 "minifyEnabled" "$F_GRV" || { echo "PATCH FAILED: release block not found"; cat "$F_GRV"; exit 1; }
          fi

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: quickcut-apk
          path: build_app/build/app/outputs/flutter-apk/*.apk

      # ---- Diagnostic: launch the app on a virtual phone and print the crash log ----
      - name: Enable KVM (needed for the virtual phone)
        continue-on-error: true
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build x86 test APK for the virtual phone
        continue-on-error: true
        working-directory: build_app
        run: flutter build apk --release --target-platform android-x64 --no-shrink

      - name: Write emulator test script
        continue-on-error: true
        run: |
          cat > emu_test.sh << 'EOF'
          adb install -r build_app/build/app/outputs/flutter-apk/app-release.apk
          adb logcat -c
          adb shell monkey -p com.quickcut.quickcut -c android.intent.category.LAUNCHER 1
          sleep 20
          adb logcat -d > emu_log.txt
          echo "=============== CRASH LOG START ==============="
          grep -n -i -E "FATAL|AndroidRuntime|UnsatisfiedLink|Fatal signal|E/flutter|MobileAds|ffmpeg|quickcut" emu_log.txt | head -120
          echo "=============== CRASH LOG END ==============="
          if grep -q "FATAL EXCEPTION" emu_log.txt; then echo "RESULT: APP CRASHED"; else echo "RESULT: NO CRASH - APP STARTED OK"; fi
          EOF

      - name: Launch app on virtual phone and print crash log
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash emu_test.sh

      - name: Save full log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: emu_log.txt
